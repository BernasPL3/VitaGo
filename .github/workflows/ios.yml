name: Build VitaGo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Build
        run: swift build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaGo
          path: .build
